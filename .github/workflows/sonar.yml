name: Optional Sonar analysis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonar:
    if: github.ref == 'refs/heads/dev'
    name: sonar-quality-gate
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - name: Require optional configuration
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_HOST_URL" ]; then
            echo "Configure SONAR_TOKEN and SONAR_HOST_URL to use this optional workflow." >&2
            exit 1
          fi
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run Sonar scanner
        uses: sonarsource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        with:
          projectBaseDir: demo-app
      - name: Enforce quality gate
        uses: sonarsource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1
        with:
          pollingTimeoutSec: 600
