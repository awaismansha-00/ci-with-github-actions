name: "Lab 14 - Checkov insecure fixtures"
on: workflow_dispatch
permissions:
  contents: read
jobs:
  expected-failure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bridgecrewio/checkov-action@5659ddea96102e16d8f221b3d8402453c0b1c150 # v12
        with:
          directory: security/fixtures/insecure
          framework: terraform,kubernetes,dockerfile
          compact: true

