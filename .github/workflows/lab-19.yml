name: "Lab 19 - Local-only DAST"
on: workflow_dispatch
permissions:
  contents: read
jobs:
  dast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node security/fixtures/insecure/dast/server.mjs &
      - run: |
          mkdir -p reports/zap
          chmod 777 reports/zap
          docker run --rm --network host \
            --volume "${PWD}/reports/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:2.16.1 \
            zap-baseline.py -t http://127.0.0.1:4010 -J report.json -w report.md -r report.html
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lab-19-zap
          path: reports/zap
          retention-days: 7
          if-no-files-found: warn

