name: Reusable secure image publication

on:
  workflow_call:
    inputs:
      image_name:
        type: string
        required: true
      tags:
        type: string
        required: true
      artifact_suffix:
        type: string
        required: true
    outputs:
      image_digest:
        value: ${{ jobs.publish.outputs.digest }}
      image_reference:
        value: ${{ jobs.publish.outputs.reference }}

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    name: secure-image-publish
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
      reference: ${{ steps.digest.outputs.reference }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image once
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
        run: docker build --tag "$IMAGE_NAME:scan-${GITHUB_SHA}" demo-app
      - name: Scan exact image with Trivy
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: ${{ inputs.image_name }}:scan-${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-image.sarif
          exit-code: "1"
      - name: Create scan network and start image
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          docker network create ci-security-scan
          docker run --detach --rm --name demo-api --network ci-security-scan "$IMAGE_NAME:scan-${GITHUB_SHA}"
      - name: Wait for application inside scan network
        run: |
          for attempt in {1..30}; do
            if docker run --rm --network ci-security-scan curlimages/curl:8.16.0 --fail --silent http://demo-api:3000/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs demo-api
          exit 1
      - name: Run local-only ZAP baseline
        run: |
          mkdir -p reports/zap
          chmod 777 reports/zap
          set +e
          docker run --rm --network ci-security-scan \
            --volume "${PWD}/reports/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:2.16.1 \
            zap-baseline.py -t http://demo-api:3000 -J report.json -w report.md -r report.html
          zap_exit=$?
          set -e
          echo "ZAP scanner exit code: ${zap_exit}"
          node scripts/gate-zap-report.mjs reports/zap/report.json
      - name: Generate source SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: demo-app
          format: spdx-json
          output-file: source.spdx.json
          upload-artifact: false
      - name: Generate image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ inputs.image_name }}:scan-${{ github.sha }}
          format: spdx-json
          output-file: image.spdx.json
          upload-artifact: false
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tag and push the scanned image
        id: push
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          TAGS: ${{ inputs.tags }}
        run: |
          source_ref="$IMAGE_NAME:scan-${GITHUB_SHA}"
          first_tag=""
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            [ -z "$first_tag" ] && first_tag="$tag"
            docker tag "$source_ref" "$IMAGE_NAME:$tag"
            docker push "$IMAGE_NAME:$tag"
          done <<< "$TAGS"
          echo "first-tag=$first_tag" >> "$GITHUB_OUTPUT"
      - name: Resolve published digest
        id: digest
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          FIRST_TAG: ${{ steps.push.outputs.first-tag }}
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE_NAME:$FIRST_TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "reference=$IMAGE_NAME@$digest" >> "$GITHUB_OUTPUT"
      - name: Attest published image
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ inputs.image_name }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
      - name: Install Cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
      - name: Sign and verify digest
        env:
          IMAGE_REFERENCE: ${{ steps.digest.outputs.reference }}
        run: |
          cosign sign --yes "$IMAGE_REFERENCE"
          cosign verify \
            --certificate-identity-regexp "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/(ci|release)\\.yml@.*" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE_REFERENCE"
      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supply-chain-${{ inputs.artifact_suffix }}
          path: |
            trivy-image.sarif
            source.spdx.json
            image.spdx.json
            reports/zap
          retention-days: 30
          if-no-files-found: warn
      - name: Stop scan target
        if: always()
        run: |
          docker rm --force demo-api 2>/dev/null || :
          docker network rm ci-security-scan 2>/dev/null || :

