name: "Lab 18 - Verify signature and attestation"
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag in this repository's GHCR package
        type: string
        default: dev
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/(ci|release)\\.yml@.*" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE"
          gh attestation verify "oci://$IMAGE" -R "$GITHUB_REPOSITORY"
