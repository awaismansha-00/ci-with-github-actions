name: "Lab 04 - Basic Node CI"
on: workflow_dispatch
permissions:
  contents: read
jobs:
  node-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-node-project
        with:
          node-version: "24"
      - working-directory: demo-app
        run: npm run check

