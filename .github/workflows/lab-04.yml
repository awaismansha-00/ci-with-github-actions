name: "Lab 04 - Basic Node CI"
on: workflow_dispatch
permissions:
  contents: read
jobs:
  node-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-project
        with:
          node-version: "24"
      - working-directory: demo-app
        run: npm run check

