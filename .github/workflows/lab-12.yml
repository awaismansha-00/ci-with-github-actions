name: "Lab 12 - Workflow auditing"
on: workflow_dispatch
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Audit active workflows with Zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          persona: auditor
      - name: Lint deliberately insecure fixture (expected failure)
        run: docker run --rm --volume "${PWD}:/repo" --workdir /repo rhysd/actionlint:1.7.9 security/fixtures/insecure/workflows/insecure.yml

