name: Set up Node project
description: Configure a supported Node version, restore npm cache, and install locked dependencies.
inputs:
  node-version:
    description: Node major or exact version.
    required: true
  working-directory:
    description: Directory containing package.json.
    required: false
    default: demo-app
  cache-dependency-path:
    description: Lockfile used to key the npm cache.
    required: false
    default: demo-app/package-lock.json
runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
    - name: Install locked dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci --ignore-scripts

